modLoader = "javafml"
loaderVersion = "[${neoforge_loader_version},)"
license = "All Rights Reserved"

[[mixins]]
config = "ftbarmory.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "FTB Armory"
authors = "FTB Team"
description = '''
FTB Armory - post-netherite metals (Adamantite, Aeternium and Aurichalcum) with their ores, materials, tools, weapons and armor.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "${geckolib_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
